$kind: http-request
url: "{{baseUrl}}/chat"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: text
  content: |-
    {
      "sessionId": "00000000-0000-0000-0000-000000000000",
      "message": "test"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 15000
