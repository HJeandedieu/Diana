$kind: http-request
url: "{{baseUrl}}/sessions"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: text
  content: |-
    {
      "title": "Second Test Session"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      const data = pm.response.json();
      pm.test('Session id returned', () => pm.expect(data.data.id).to.be.a('string'));
      pm.test('Different from first session', () => {
        pm.expect(data.data.id).to.not.equal(pm.collectionVariables.get('sessionId'));
      });
    language: text/javascript
order: 7000
