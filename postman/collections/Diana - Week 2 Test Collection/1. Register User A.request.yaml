$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{emailA}}",
      "password": "password123"
    }
scripts:
  - type: beforeRequest
    code: |-
      const stamp = Date.now();
      pm.collectionVariables.set('emailA', `usera_${stamp}@test.com`);
      pm.collectionVariables.set('emailB', `userb_${stamp}@test.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      const data = pm.response.json();
      pm.collectionVariables.set('tokenA', data.data.token);
      pm.test('Token returned', () => pm.expect(data.data.token).to.be.a('string'));
    language: text/javascript
order: 1000
