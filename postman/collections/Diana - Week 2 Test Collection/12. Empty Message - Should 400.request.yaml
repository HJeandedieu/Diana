$kind: http-request
url: "{{baseUrl}}/chat"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: text
  content: |-
    {
      "sessionId": "{{sessionId}}",
      "message": ""
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 16000
